name: solver-regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # =====================================================================
  # Tier 1/2 — Fast feedback: every push and PR. Target wall time < 3 min.
  # Static/manifest, unit-contract gates, and a single A/B candidate-key
  # smoke round. Heavy evidence suites run only in the qualification layer.
  # =====================================================================
  fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:manifest
      - run: npm run check:no-tower-solver-js
      - run: npm run check:solver-job
      - run: npm run check:launcher
      - run: npm run check:route-free-state
      - run: npm run check:tower-ir-shadow
      - run: npm run check:candidate-key-smoke
      - run: npm run check:real-route-performance-contract
      - run: npm run check:walk-reachability-fast-path
      - run: npm run check:goal-directed-search
      - run: npm run check:eval-vector
      - run: npm run check:mt5-feasibility-surface
      - run: npm run check:mt5-third-gate-resource-timing
      - run: npm run check:mt5-blueking-long-chain

  # =====================================================================
  # Tier 3 — Qualification gate. Runs only for marker commits
  # (docs: record/close/baseline/promotion/qualification ...), PRs that
  # request qualification, or manual workflow_dispatch. The gate job
  # carries the single marker expression; all evidence jobs depend on it.
  # =====================================================================
  qualification-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, 'docs:') &&
       (contains(github.event.head_commit.message, 'record') ||
        contains(github.event.head_commit.message, 'close') ||
        contains(github.event.head_commit.message, 'baseline') ||
        contains(github.event.head_commit.message, 'promotion') ||
        contains(github.event.head_commit.message, 'qualification'))) ||
      (github.event_name == 'pull_request' &&
       (contains(github.event.pull_request.title, 'qualification') ||
        contains(github.event.pull_request.title, 'promotion') ||
        contains(github.event.pull_request.body, 'qualification') ||
        contains(github.event.pull_request.body, 'promotion')))
    runs-on: ubuntu-latest
    steps:
      - run: echo "Qualification requested; running full evidence suite"

  qualification-key-analysis:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:key-dependency
      - run: npm run check:dual-key-shadow
      - run: npm run check:perf-baseline

  qualification-promotion:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:candidate-key-promotion

  qualification-benchmark:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:candidate-key-paired-benchmark

  qualification-real-route-performance:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run bench:real-route:mt4-manual

  qualification-post-mt5-baseline:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:post-mt5-long-chain-baseline

  qualification-promotion-contract:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:mt1-default-promotion

  qualification-post-promotion-regression:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:mt1-post-promotion-regression

  qualification-multi-region-key-shadow:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:multi-region-key-shadow

  qualification-multi-region-boundary-matrix:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:multi-region-boundary-matrix

  qualification-workload-matrix:
    needs: qualification-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-solver
    strategy:
      fail-fast: false
      matrix:
        workload:
          - exp9-maxfinalhp
          - exp6-maxfinalhp
          - exp8-maxfinalhp
          - exp9-maxatk
          - tile4_1-maxfinalhp
          - tile2_1-maxfinalhp
    env:
      MT1_WORKLOAD_SUBSET: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:mt1-workload-matrix

  # =====================================================================
  # Qualification summary — single overall status for the full evidence
  # suite. Runs in parallel with nothing (it only aggregates), so wall time
  # is max(fast, key-analysis, promotion, benchmark, workload matrix).
  # Skipped alongside the gate on non-marker commits; any failing evidence
  # job fails the summary's dependencies and shows up as skipped here while
  # the failure is reported by the concrete job itself.
  # =====================================================================
  qualification-summary:
    needs:
      - fast
      - qualification-gate
      - qualification-key-analysis
      - qualification-promotion
      - qualification-benchmark
      - qualification-real-route-performance
      - qualification-post-mt5-baseline
      - qualification-promotion-contract
      - qualification-post-promotion-regression
      - qualification-multi-region-key-shadow
      - qualification-multi-region-boundary-matrix
      - qualification-workload-matrix
    if: needs.qualification-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full qualification passed (fast + key-analysis + promotion + micro benchmark + real-route performance + post-MT5 baseline + promotion-contract + post-promotion-regression + multi-region-key-shadow + multi-region-boundary-matrix + workload matrix)"
