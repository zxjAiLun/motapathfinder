        working-directory: shared-solver
    strategy:
      fail-fast: false
      matrix:
        workload:
          - exp9-maxfinalhp
          - exp6-maxfinalhp
          - exp8-maxfinalhp
          - exp9-maxatk
          - tile4_1-maxfinalhp
          - tile2_1-maxfinalhp
    env:
      MT1_WORKLOAD_SUBSET: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:mt1-workload-matrix

  # =====================================================================
  # Qualification summary — single overall status for the full evidence
  # suite. Runs in parallel with nothing (it only aggregates), so wall time
  # is max(fast, key-analysis, promotion, benchmark, workload matrix).
  # Skipped alongside the gate on non-marker commits; any failing evidence
  # job fails the summary's dependencies and shows up as skipped here while
  # the failure is reported by the concrete job itself.
  # =====================================================================
  qualification-summary:
    needs:
      - fast
      - qualification-gate
      - qualification-key-analysis
      - qualification-promotion
      - qualification-benchmark
      - qualification-real-route-performance
      - qualification-post-mt5-baseline
      - qualification-mt6-defense-causal-repair
      - qualification-mt7-left-sword-budget-baseline
      - qualification-search-outcome-taxonomy
      - qualification-strategic-blocker-connector
      - qualification-strategic-dependency-connector
      - qualification-strategic-dependency-attribution
      - qualification-strategic-battle-access-prerequisite
      - qualification-strategic-battle-viability
      - qualification-strategic-parent-dependency-continuation
      - qualification-strategic-hierarchical-call-allocation
      - qualification-strategic-battle-stage-prerequisite
      - qualification-strategic-continuation-anchor-expansion-scheduling
      - qualification-mt7-mt8-travel-variant-replay-repair
      - qualification-promotion-contract
      - qualification-post-promotion-regression
      - qualification-multi-region-key-shadow
      - qualification-multi-region-boundary-matrix
      - qualification-reachability-reuse-attribution
      - qualification-reachability-skeleton-cache
      - qualification-reachability-rebase-attribution
      - qualification-topology-first-materialization
      - qualification-remaining-materialization-attribution
      - qualification-battle-evaluation-projection
      - qualification-reachability-optimization-requalification
      - qualification-full-solve-hotspot-reprofiling
      - qualification-workload-matrix
    if: needs.qualification-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full qualification passed (fast + key-analysis + promotion + micro benchmark + real-route performance + post-MT5 baseline + MT6 defense causal repair + MT7 left-sword budget baseline + search outcome taxonomy + strategic blocker connector + strategic dependency connector + strategic dependency attribution + strategic battle access prerequisite + strategic battle viability + strategic parent dependency continuation + strategic hierarchical call allocation + strategic battle stage prerequisite + strategic continuation anchor expansion scheduling + MT7-to-MT8 travel-variant replay repair + promotion-contract + post-promotion-regression + multi-region-key-shadow + multi-region-boundary-matrix + reachability reuse attribution + reachability skeleton cache + reachability rebase attribution + topology-first materialization + remaining materialization attribution + battle evaluation projection + reachability optimization requalification + full solve hotspot reprofiling + workload matrix)"
