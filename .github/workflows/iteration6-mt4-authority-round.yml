name: iteration6c-site-attribution

on:
  workflow_dispatch:
  push:
    branches:
      - qualification/iteration6c-site-attribution

jobs:
  iteration6-site-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: shared-solver
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Environment capture
        run: |
          uname -a
          lscpu
          free -m
          node --version
          node -p process.versions.v8
          node -p process.arch
          node -p process.platform
          git rev-parse HEAD

      - name: Run Iteration-6 2x2 site attribution (A/B/C/D)
        run: |
          node --expose-gc qualification/iteration6-mt4-linux/run-authority-round.js | tee routes/generated/iteration6-site-attribution.json

      - name: Upload attribution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration6-site-attribution
          path: |
            shared-solver/routes/generated/iteration6-site-attribution.json
          if-no-files-found: error
          retention-days: 90
