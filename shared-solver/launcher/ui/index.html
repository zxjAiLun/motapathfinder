<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Solver Launcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>Solver Launcher</h1>
      <span id="health" class="health-dot"></span>
      <span id="health-text" class="muted">连接中…</span>
    </div>
    <div class="run-bar">
      <label>Tower <select id="tower-select"></select></label>
      <label>Region <select id="region-select"></select></label>
      <button id="region-add-btn" type="button">＋ 添加 Region</button>
      <label>Rank <input id="rank-input" value="chaos"></label>
      <label>目标
        <select id="objective-mode">
          <option value="clear">Clear / legacy</option>
          <option value="max-final-hp" selected>Max final HP</option>
          <option value="maximize">Maximize field</option>
          <option value="maximize-score">Weighted score</option>
          <option value="lexicographic">Lexicographic</option>
        </select>
      </label>
      <button id="validate-btn">Validate</button>
      <button id="submit-btn" class="primary">Run Job</button>
    </div>
    <div id="region-order-wrap" class="region-order-wrap">
      <span class="muted small">Region 顺序（≥1 时输出 solve-task.v2；空时走 v1 单区）</span>
      <div id="region-order-list" class="region-order-list"></div>
    </div>
  </header>

  <main class="layout">
    <section class="col-left">
      <h2>Job History</h2>
      <div class="filters">
        <button data-filter="all" class="filter-btn active">全部</button>
        <button data-filter="active" class="filter-btn">进行中</button>
        <button data-filter="completed" class="filter-btn">已完成</button>
        <button data-filter="failed" class="filter-btn">未完成</button>
        <button data-filter="cancelled" class="filter-btn">已取消</button>
      </div>
      <div id="job-table" class="job-list"></div>
    </section>

    <section class="col-center">
      <h2>任务配置</h2>
      <div id="tower-meta" class="muted small"></div>
      <details open>
        <summary>模型（SolverModel，手动配置权威）</summary>
        <table id="model-table" class="model-table">
          <thead><tr><th>字段</th><th>mode</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
      <details open>
        <summary>目标（ObjectiveSpec JSON）</summary>
        <div id="objective-field-wrap" style="display:none">
          <label>Field <input id="objective-field" placeholder="hero.atk"></label>
        </div>
        <div id="score-terms-wrap" style="display:none">
          <label>terms <textarea id="score-terms" rows="4">[{"path":"hero.hp","weight":1}]</textarea></label>
        </div>
        <div id="lex-items-wrap" style="display:none">
          <label>objectives <textarea id="lex-items" rows="4">["clear","max-final-hp"]</textarea></label>
        </div>
        <div id="objective-json-wrap">
          <label>目标 JSON <textarea id="objective-json" rows="4">{"mode":"max-final-hp"}</textarea></label>
        </div>
      </details>
      <details open>
        <summary>搜索预算</summary>
        <div class="budget-grid">
          <label>maxExpansions <input id="s-max-expansions" type="number" value="50000" min="1"></label>
          <label>maxRuntimeMs（0=不限） <input id="s-max-runtime" type="number" value="0" min="0"></label>
          <label>maxActionsPerState <input id="s-max-actions" type="number" value="256" min="1"></label>
          <label>candidateLimit <input id="s-candidate-limit" type="number" value="8" min="1"></label>
          <label>regionCandidateLimit <input id="s-region-candidate-limit" type="number" value="8" min="1"></label>
          <label>goalSkylineLimit <input id="s-goal-skyline" type="number" value="8" min="1"></label>
          <label>dpSkylineMax <input id="s-dp-skyline" type="number" value="1" min="1"></label>
          <label class="inline"><input id="s-stop-first" type="checkbox"> stopOnFirstGoal</label>
        </div>
      </details>
      <details open>
        <summary>验证</summary>
        <label class="inline"><input id="strict-replay" type="checkbox" checked> strictReplay（真实 runtime replay）</label>
        <p class="muted small">关闭时生成 route artifact，但不会标记为 runtime verified。</p>
      </details>
    </section>

    <section class="col-right">
      <h2>Preflight</h2>
      <div id="preflight-result" class="small">
        <div class="muted">点击 Validate 查看指纹与预算。</div>
      </div>
      <pre id="normalized-task" class="scroll"></pre>
    </section>

    <section class="col-bottom">
      <h2 id="current-job-title">当前 Job</h2>
      <div id="job-detail">
        <div class="muted">提交任务后在此查看实时进度。</div>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
